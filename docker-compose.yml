# Local development: database only. Run the apps with `pnpm dev`.
#   docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
      POSTGRES_DB: dnd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # Production-like run of the whole app in one container:
  #   docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://dnd:dnd@postgres:5432/dnd
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PROMO_CAMPAIGN_ID: ${PROMO_CAMPAIGN_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.rfp11.com}
      S3_BUCKET: ${S3_BUCKET:-dnd-serpih}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
