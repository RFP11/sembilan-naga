# Local development: database only. Run the apps with `pnpm dev`.
#   docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
      POSTGRES_DB: dnd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # Production-like run of the whole app in one container:
  #   docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgres://dnd:dnd@postgres:5432/dnd
    ports:
      - "4000:4000"
    depends_on:
      - postgres

volumes:
  pgdata:
